name: build-snap
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snap:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
            suffix: ""
          - arch: arm64
            runs-on: ubuntu-24.04-arm
            suffix: "-arm64"
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - uses: snapcore/action-build@v1
        id: snapcraft
        with:
          snapcraft-channel: edge
      - name: Normalize snap filename
        run: cp "${{ steps.snapcraft.outputs.snap }}" geoclue${{ matrix.suffix }}.snap
      - name: Publish to desktop-26-latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view desktop-26-latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create desktop-26-latest -R "$GITHUB_REPOSITORY" \
                 --title "desktop/26 latest snap" \
                 --notes "Rolling latest main snap build; assets are replaced on every green build."
          gh release upload desktop-26-latest geoclue${{ matrix.suffix }}.snap -R "$GITHUB_REPOSITORY" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: snap${{ matrix.suffix }}
          path: geoclue${{ matrix.suffix }}.snap
          compression-level: 0
          retention-days: 14
